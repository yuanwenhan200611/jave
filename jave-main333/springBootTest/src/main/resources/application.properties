spring.application.name=springBootTest
spring.profiles.active=dev

# ===================== 数据源配置 =====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/login_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===================== MyBatis-Plus =====================
# 驼峰转换（MP 默认开启，显式声明便于阅读）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 控制台打印 SQL，便于调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 关闭 MP banner
mybatis-plus.global-config.banner=false

# 日志级别
logging.level.root=info
logging.level.com.fenglin.springboottest=warn
# 日志文件位置
logging.file.name=log/xx.log
# 控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
# 文件日志格式（注意：原配置误写成了 logging.pattern.file=logging.pattern.console=...，值里混入了键名）
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n